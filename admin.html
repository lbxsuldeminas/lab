
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administração - LBX Sul de Minas</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <h1>Área Administrativa - LBX Sul de Minas</h1>

  <section id="login">
    <h2>Entrar</h2>

    <input type="email" id="email" placeholder="E-mail">
    <input type="password" id="senha" placeholder="Senha">

    <button id="entrar">Entrar</button>

    <p id="mensagem"></p>
  </section>

  <section id="painel" hidden>
    <h2>Painel administrativo</h2>
    <p>Você entrou na área administrativa.</p>

    <h3>Cadastrar novo evento</h3>

<label>Nome do evento:</label>
<input type="text" id="nomeEvento" placeholder="Ex.: Copa Andrelândia 2026">

<label>Data:</label>
<input type="date" id="dataEvento">

<label>Local:</label>
<input type="text" id="localEvento" placeholder="Ex.: Andrelândia - MG">

<button id="cadastrarEvento">Cadastrar evento</button>

<p id="mensagemEvento"></p>

    <h3>Adicionar torneio do Chess-Results</h3>
    <label>Evento:</label>
<select id="eventoSelecionado">
  <option value="">Carregando eventos...</option>
</select>

<label>Link do torneio:</label>
<input
  type="url"
  id="linkTorneio"
  placeholder="https://chess-results.com/..."
>

<label>Número de rodadas:</label>
<input
  type="number"
  id="rodadasTorneio"
  min="1"
  placeholder="Ex.: 5"
>

<button id="importarTorneio">Importar torneio</button>
<p id="mensagemImportacao"></p>

<button id="sair">Sair</button>
</section>

  <script src="admin.js"></script>

</body>
</html>
