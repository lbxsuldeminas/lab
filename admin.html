
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administração - LBX Sul de Minas</title>
</head>
<body>

  <h1>Área Administrativa - LBX Sul de Minas</h1>

  <section id="login">
    <h2>Entrar</h2>

    <input type="email" id="email" placeholder="E-mail">
    <input type="password" id="senha" placeholder="Senha">

    <button id="entrar">Entrar</button>

    <p id="mensagem"></p>
  </section>

  <section id="painel" hidden>
    <h2>Painel administrativo</h2>
    <p>Você entrou na área administrativa.</p>

    <h3>Cadastrar novo evento</h3>

<label>Nome do evento:</label>
<input type="text" id="nomeEvento" placeholder="Ex.: Copa Andrelândia 2026">

<label>Data:</label>
<input type="date" id="dataEvento">

<label>Local:</label>
<input type="text" id="localEvento" placeholder="Ex.: Andrelândia - MG">

<button id="cadastrarEvento">Cadastrar evento</button>

<p id="mensagemEvento"></p>

    <button id="sair">Sair</button>
  </section>

  <script src="admin.js"></script>

</body>
</html>
