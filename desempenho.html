<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#102b46">
  <meta name="description" content="Consulte o desempenho individual dos atletas da LBX Sul de Minas.">

  <title>Desempenho Individual | LBX Sul de Minas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="desempenho.css">
</head>

<body>

  <header class="cabecalho">

    <a href="index.html" class="voltar">
      ← Voltar ao site
    </a>

    <h1>Desempenho Individual</h1>

    <p>
      Histórico e estatísticas dos atletas da LBX Sul de Minas
    </p>

  </header>

  <main class="container">

    <section class="busca">

      <h2>Consulte seu desempenho</h2>

      <p>
        Digite o nome do atleta para consultar seu histórico nos torneios da LBX.
      </p>

      <div class="campo-busca">

        <input
          type="text"
          id="nomeAtleta"
          placeholder="Digite o nome do atleta..."
          aria-label="Nome do atleta"
          autocomplete="off"
        >

        <button id="btnBuscar" type="button">
          Buscar
        </button>

      </div>

    </section>

    <section
      id="resultado"
      class="resultado"
      aria-live="polite"
      aria-atomic="false"
    >

      <p>
        O perfil do atleta aparecerá aqui após a pesquisa.
      </p>

    </section>

  </main>

  <footer>
    <p>LBX — Liga de Xadrez do Sul de Minas</p>
  </footer>

  <script src="desempenho.js"></script>

</body>
</html>
