
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desempenho Individual | LBX Sul de Minas</title>
  <link rel="stylesheet" href="desempenho.css">
</head>
<body>

  <header class="cabecalho">
    <a href="index.html" class="voltar">← Voltar ao site</a>
    <h1>Desempenho Individual</h1>
    <p>Histórico e estatísticas dos atletas da LBX Sul de Minas</p>
  </header>

  <main class="container">
    <section class="busca">
      <h2>Consulte seu desempenho</h2>
      <p>Digite o nome do atleta para consultar seu histórico nos torneios da LBX.</p>

      <div class="campo-busca">
        <input
          type="text"
          id="nomeAtleta"
          placeholder="Digite o nome do atleta..."
        >
        <button id="btnBuscar">Buscar</button>
      </div>
    </section>

    <section id="resultado" class="resultado">
      <p>O perfil do atleta aparecerá aqui após a pesquisa.</p>
    </section>
  </main>

  <footer>
    <p>LBX — Liga de Xadrez do Sul de Minas</p>
  </footer>

  <script src="desempenho.js"></script>
</body>
</html>
